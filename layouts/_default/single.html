{{ define "main" }}
<section class="page-hero">
<div class="container">
<nav class="breadcrumbs" aria-label="{{ i18n "breadcrumbs" }}">
<a href="{{ .Site.Home.RelPermalink }}">{{ i18n "home_label" }}</a>
<span aria-hidden="true">/</span>
<span>{{ .Title }}</span>
</nav>
<h1>{{ .Title }}</h1>{{ with .Description }}
<p class="lead">{{ . }}</p>{{ end }}</div>
</section>
<div class="container general-layout">
<article class="prose">{{ .Content }}</article>
<aside class="docs-toc">
<p>{{ i18n "on_this_page" }}</p>{{ .TableOfContents }}<a class="toc-top" href="{{ "docs/" | relLangURL }}">{{ i18n "explore_docs" }} ↗</a>
</aside>
</div>{{ end }}
