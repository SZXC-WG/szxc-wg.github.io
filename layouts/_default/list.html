{{ define "main" }}
<section class="page-hero">
<div class="container">
<p class="eyebrow">LocalGen</p>
<h1>{{ .Title }}</h1>{{ with .Description }}
<p class="lead">{{ . }}</p>{{ end }}</div>
</section>
<section class="page-section">
<div class="container">
<div class="prose prose-panel">{{ .Content }}</div>{{ with .RegularPages }}
<div class="docs-card-grid">{{ range .ByWeight }}<a class="docs-card" href="{{ .RelPermalink }}">
<h2>{{ .Title }}</h2>
<p>{{ .Description }}</p>
</a>{{ end }}</div>{{ end }}</div>
</section>{{ end }}
