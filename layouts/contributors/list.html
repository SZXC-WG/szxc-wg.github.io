{{ define "main" }}
<section class="page-hero">
<div class="container">
<p class="eyebrow">{{ i18n "community" }}</p>
<h1>{{ .Title }}</h1>
<p class="lead">{{ .Description }}</p>
</div>
</section>
<section class="page-section">
<div class="container">
<div class="prose prose-panel">{{ .Content }}</div>
<div class="contributor-grid">{{ range hugo.Data.contributors.items }}<a class="contributor-card" href="{{ .html_url }}">
<img src="{{ .avatar_url }}" alt="" width="56" height="56" loading="lazy">
<div>
<h2>{{ .login }}</h2>
<p>{{ .contributions }} {{ i18n "contributions_label" }}</p>
</div>
<span aria-hidden="true">↗</span>
</a>{{ else }}
<p>{{ i18n "contributors_empty" }}</p>{{ end }}</div>
</div>
</section>{{ end }}
