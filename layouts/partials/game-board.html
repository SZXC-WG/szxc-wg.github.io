<figure class="game-figure">
<div class="board-heading">
<span>
<span class="status-dot">
</span> {{ i18n "board_heading" }}</span>
<span>LOCAL / FFA</span>
</div>
<div class="board-stage">
<div class="strategy-board" aria-hidden="true">
{{ range $i := seq 0 80 }}
{{ $color := "neutral" }}{{ $value := "" }}{{ $icon := "" }}
{{ if in (slice 0 1 2 9 10 11 12 18 19 20 21 22 28 29 30 31 39 40) $i }}{{ $color = "blue" }}{{ $value = "1" }}{{ end }}
{{ if in (slice 41 48 49 50 51 58 59 60 61 67 68 69 70 71 77 78 79 80) $i }}{{ $color = "red" }}{{ $value = "1" }}{{ end }}
{{ if in (slice 4 6 14 16 26 27 33 35 36 42 44 45 54 56 63 65 72 74) $i }}{{ $color = "mountain" }}{{ $icon = "mountain" }}{{ end }}
{{ if in (slice 7 17 23 24 25 34 43 53 62 73) $i }}{{ $color = "fog" }}{{ end }}
{{ if eq $i 10 }}{{ $icon = "crown" }}{{ $value = "48" }}{{ end }}
{{ if eq $i 70 }}{{ $icon = "crown" }}{{ $value = "36" }}{{ end }}
{{ if eq $i 30 }}{{ $value = "24" }}{{ end }}{{ if eq $i 31 }}{{ $value = "12" }}{{ end }}{{ if eq $i 40 }}{{ $value = "8" }}{{ end }}{{ if eq $i 41 }}{{ $value = "16" }}{{ end }}{{ if eq $i 49 }}{{ $value = "21" }}{{ end }}
{{ if in (slice 5 38 75) $i }}{{ $icon = "city" }}{{ $value = "40" }}{{ end }}
<span class="board-cell cell-{{ $color }} {{ if eq $i 31 }}cell-selected{{ end }}">{{ with $icon }}{{ partial "icon.html" . }}{{ end }}{{ with $value }}<span>{{ . }}</span>{{ end }}</span>
{{ end }}
</div>
<div class="board-coordinate" aria-hidden="true">01 — 09 / LOCALGEN</div>
</div>
<figcaption>
<span>
<i class="legend-dot blue">
</i>{{ i18n "board_you" }}<i class="legend-dot red">
</i>Bot</span>
<span>{{ i18n "board_caption" }}</span>
</figcaption>
</figure>
